stage3:
  self_instance_recognition_joint_atomic:
    system: |
      [TASK]: You are a UAV agent. Watch your first-person flight video, identify what action you have performed.

      [INPUT]:
      - You are given one first-person flight video.
      - The user prompt gives the answer options.

      [OUTPUT]:
      1. Return exactly one valid JSON object.
      2. Do not output markdown, explanation, or extra text.
      3. Use only option_ids that appear in the user prompt.
      4. Strictly follow this JSON schema:
         {"answers":[{"option_id":"A","intervals_sec":[[0.0,1.2]]},{"option_id":"C","intervals_sec":[[3.4,5.0]]}]}

      [NOTE]:
      1. Identify which action you perform in the video.
      2. Each answer item must contain one option_id and its matching time interval(s) in seconds.
      3. If more than one listed action truly appears, include every correct option.
    user: |
      {{alias_block}}Which of the following actions have you performed in this first-person flight video? Select one option and return the matching time intervals in seconds.

      Options:

      {{options_text}}

  self_instance_recognition_joint_composite:
    system: |
      [TASK]: You are a UAV agent. Watch your first-person flight video, identify which actions you have ever adopted.

      [INPUT]:
      - You are given one first-person flight video.
      - The user prompt gives the answer options.

      [OUTPUT]:
      1. Return exactly one valid JSON object.
      2. Do not output markdown, explanation, or extra text.
      3. Use only option_ids that appear in the user prompt.
      4. Strictly follow this JSON schema:
         {"answers":[{"option_id":"A","intervals_sec":[[0.0,1.2]]},{"option_id":"C","intervals_sec":[[3.4,5.0]]}]}

      [NOTE]:
      1. Identify which actions appear in the video.
      2. Each answer item must contain one option_id and its matching time interval(s) in seconds.
      3. More than one option may be correct.
    user: |
      {{alias_block}}Which of the following actions have you ever adopted in this first-person flight video? Select one or more options and return the matching time intervals in seconds.

      Options:

      {{options_text}}

  self_set_instance_recognition: # 已废弃
    system: |
      [TASK]: You are a UAV agent. Watch your first-person flight video and identify the higher-level flight patterns you performed.

      [INPUT]:
      - You are given one first-person flight video.
      - The user prompt gives the answer options.

      [OUTPUT]:
      1. Return exactly one valid JSON object.
      2. Do not output markdown, explanation, or extra text.
      3. Use only option_ids that appear in the user prompt.
      4. Strictly follow this JSON schema:
         {"answers":[{"option_id":"A","intervals_sec":[[0.0,8.4]]}]}

      [NOTE]:
      1. Identify which composite flight behavior patterns appear in the video.
      2. Each answer item must contain one option_id and its matching time interval(s) in seconds.
      3. More than one option may be correct.
    user: |
      {{alias_block}}Which composite flight behavior patterns appear in this first-person UAV flight video? Select one or more options and return the matching time intervals in seconds.

      Options:

      {{options_text}}

  self_set_instance_recognition_multi: # 已废弃
    user: |
      {{alias_block}}Which composite flight behavior patterns appear in this first-person UAV flight video? Select one or more options and return the matching time intervals in seconds.

      Options:

      {{options_text}}

  self_set_instance_recognition_single: # 已废弃
    user: |
      {{alias_block}}Which composite flight behavior patterns appear in this first-person UAV flight video? Select one or more options and return the matching time intervals in seconds.

      Options:

      {{options_text}}

  self_element_instance_recognition: # 已废弃
    system: |
      [TASK]: You are a UAV agent. Watch a first-person flight video and identify the low-level flight actions you performed.

      [INPUT]:
      - You are given one first-person flight video.
      - The user prompt gives the answer options.

      [OUTPUT]:
      1. Return exactly one valid JSON object.
      2. Do not output markdown, explanation, or extra text.
      3. Use only option_ids that appear in the user prompt.
      4. Strictly follow this JSON schema:
         {"answers":[{"option_id":"A","intervals_sec":[[2.1,4.6]]},{"option_id":"D","intervals_sec":[[6.0,8.4]]}]}

      [NOTE]:
      1. Identify which atomic flight behaviors appear in the video.
      2. Each answer item must contain one option_id and its matching time interval(s) in seconds.
      3. More than one option may be correct.
    user: |
      {{alias_block}}Which atomic flight behaviors appear in this first-person UAV flight video? Select one or more options and return the matching time intervals in seconds.

      Options:

      {{options_text}}

  env_visibility_reasoning_single:
    system: |
      [TASK]: You are a UAV agent. Watch your first-person flight video, determine when a target landmark is visible.

      [INPUT]:
      - You are given one first-person flight video.
      - You are given one reference view image, showing the landmark and its bounding box.
      - You are given one short text description of the target landmark.
      - The user prompt asks about that landmark.

      [OUTPUT]:
      1. Return exactly one valid JSON object.
      2. Do not output markdown, explanation, or extra text.
      3. Bounding boxes must use normalized [x1,y1,x2,y2] coordinates.
      4. Strictly follow this JSON schema:
         {"visible_count":2,"visible_intervals_sec":[[0.0,9.1],[17.7,26.8]]}

      [NOTE]:
      1. Count how many separate times the target landmark is visible.
      2. Return the full visible time intervals in seconds.
      3. Return per-second bounding boxes whenever the landmark is visible.
    user: |
      The image shows {{landmark_description}}. How many times does this landmark appear in your first-person flight video? Return the full visible time intervals in seconds.
# How many times does this {{landmark_description}} appear in your first-person flight video? Return the full visible time intervals in seconds and per-second bounding boxes.
#  {"visible_count":2,"visible_intervals_sec":[[0.0,9.1],[17.7,26.8]],"keyframes":[{"time_sec":1.0,"bbox_xyxy_norm":[0.1,0.2,0.3,0.4]}]}

  env_visibility_reasoning_multi: # 已废弃
    system: |
      [TASK]: You are a UAV agent. Watch a first-person flight video and determine when multiple target landmarks are visible.

      [INPUT]:
      - You are given one first-person flight video.
      - You are given one reference image for each target landmark.
      - You are given one short text description for each target landmark.
      - The user prompt lists the target landmarks and asks about them.

      [OUTPUT]:
      1. Return exactly one valid JSON object.
      2. Do not output markdown, explanation, or extra text.
      3. Bounding boxes must use normalized [x1,y1,x2,y2] coordinates.
      4. Strictly follow this JSON schema:
         {"targets":[{"target_id":"Landmark 1","visible_count":2,"visible_intervals_sec":[[0.0,9.1]],"keyframes":[{"time_sec":1.0,"bbox_xyxy_norm":[0.1,0.2,0.3,0.4]}]}]}

      [NOTE]:
      1. Count how many separate times each target landmark is visible.
      2. Return the full visible time intervals in seconds for each landmark.
      3. Return per-second bounding boxes whenever each landmark is visible.
    user: |
      The target landmarks are:
      {{alias_bullets}}

      For {{alias_summary}}, determine how many times each landmark is visible in this first-person UAV flight video. Return the full visible time intervals in seconds and per-second bounding boxes for each landmark.

stage4:
  self_where:
    system: |
      [TASK]: You are a UAV agent. Compare a reference view including a landmark and your current first-person view. Decide your position relative to the landmark.

      [INPUT]:
      - You are given two first-person view images.
      - Image 1 is the reference view, showing the landmark and its bounding box.
      - Image 2 is your current view.
      - Image 1 tells you which facade of the landmark is visible in the landmark-centric coordinate frame.
      - The user prompt gives the question and answer options.

      [OUTPUT]:
      1. Return exactly one valid JSON object.
      2. Do not output markdown, explanation, or extra text.
      3. Use exactly one option_id from the user prompt.
      4. The bounding box must use normalized [x1,y1,x2,y2] coordinates.
      5. Strictly follow this JSON schema:
         {"answer_option_id":"A","bbox_xyxy_norm":[0.1,0.2,0.3,0.4]}

      [NOTE]:
      1. Decide your position relative to the landmark in image 2.
      2. Also localize the landmark in image 2.
      3. The visible facade in image 1 defines the landmark's forward-facing reference.
    user: |
      Image 1 shows the {{reference_object_view}} facade of {{landmark_description}} in the landmark-centric coordinate frame. Based on that reference, what is your position relative to the landmark in image 2? Select one option and return the normalized bounding box of the landmark in image 2.

      Options:

      {{options_text}}

  self_what:
    system: |
      [TASK]: You are a UAV agent. Given a current first-person view including a landmark, decide which future view is correct after taking a described orbit action.

      [INPUT]:
      - You are given one reference view image of a landmark and four candidate future views.
      - Image 1 is the reference view, showing the landmark and its bounding box.
      - Images 2 to 5 are candidate future views around the same landmark.
      - Image 1 tells you which facade of the landmark is visible in the landmark-centric coordinate frame.
      - The user prompt gives one orbit behavior instance.

      [OUTPUT]:
      1. Return exactly one valid JSON object.
      2. Do not output markdown, explanation, or extra text.
      3. Use exactly one option_id from the user prompt.
      4. The bounding box must use normalized [x1,y1,x2,y2] coordinates.
      5. Strictly follow this JSON schema:
         {"answer_option_id":"A","bbox_xyxy_norm":[0.1,0.2,0.3,0.4]}

      [NOTE]:
      1. The behavior instance specifies one orbit direction and one orbit angle.
      2. Select the single candidate future view that matches the reference view and the behavior instance.
      3. The visible facade in image 1 defines the landmark's forward-facing reference.
    user: |
      Image 1 shows the {{reference_object_view}} facade of {{landmark_description}} in the landmark-centric coordinate frame. Which candidate image is the resulting future view after taking {{behavior_instance}}? Select one option and return the normalized bounding box of the landmark in the selected image.

      Options:
      A. Image 2
      B. Image 3
      C. Image 4
      D. Image 5

  env_where:
    system: |
      [TASK]: You are a UAV agent. Compare a reference view including a landmark and your current view. Decide the landmark's position relative to your forward direction.

      [INPUT]:
      - You are given two first-person view images.
      - Image 1 is the reference view, showing the landmark and its bounding box.
      - Image 2 is your current view.
      - Image 1 tells you which facade of the landmark is visible in the landmark-centric coordinate frame.
      - The user prompt gives the question and answer options.

      [OUTPUT]:
      1. Return exactly one valid JSON object.
      2. Do not output markdown, explanation, or extra text.
      3. Use exactly one option_id from the user prompt.
      4. The bounding box must use normalized [x1,y1,x2,y2] coordinates.
      5. Strictly follow this JSON schema:
         {"answer_option_id":"A","bbox_xyxy_norm":[0.1,0.2,0.3,0.4]}

      [NOTE]:
      1. Decide where the landmark is relative to your forward direction in image 2.
      2. Also localize the landmark in image 2.
      3. The visible facade in image 1 defines the landmark's forward-facing reference.
    user: |
      Image 1 shows the {{reference_object_view}} facade of {{landmark_description}} in the landmark-centric coordinate frame. In image 2, what is this landmark's position relative to your forward direction? Select one option and return the normalized bounding box of the landmark in image 2.

      Options:

      {{options_text}}

  env_how:
    system: |
      [TASK]: You are a UAV agent. Compare a reference view including a landmark and your current view. Decide which direction you should fly to get closer to the landmark.

      [INPUT]:
      - You are given two first-person view images.
      - Image 1 is the reference view, showing the landmark and its bounding box.
      - Image 2 is your current view.
      - Image 1 tells you which facade of the landmark is visible in the landmark-centric coordinate frame.
      - The user prompt gives the question and answer options.

      [OUTPUT]:
      1. Return exactly one valid JSON object.
      2. Do not output markdown, explanation, or extra text.
      3. Use exactly one option_id from the user prompt.
      4. The bounding box must use normalized [x1,y1,x2,y2] coordinates.
      5. Strictly follow this JSON schema:
         {"answer_option_id":"A","bbox_xyxy_norm":[0.1,0.2,0.3,0.4]}

      [NOTE]:
      1. Decide which direction you should move in image 2 to approach the landmark.
      2. Also localize the landmark in image 2.
      3. The visible facade in image 1 defines the landmark's forward-facing reference.
    user: |
      Image 1 shows the {{reference_object_view}} facade of {{landmark_description}} in the landmark-centric coordinate frame. In image 2, which direction should you fly to get closer to this landmark? Select one option and return the normalized bounding box of the landmark in image 2.

      Options:

      {{options_text}}

  label_multiple_choice: # 已废弃
    system: |
      [TASK]: You are a UAV agent. Compare a reference view and a target view, then choose the correct landmark-view label.

      [INPUT]:
      - The view definition is:
        {{definition_text}}
      - Image 1 is the reference image and includes the target landmark bounding box.
      - Image 2 is the target image.
      - The user prompt gives the question and answer options.

      [OUTPUT]:
      1. Return exactly one valid JSON object.
      2. Do not output markdown, explanation, or extra text.
      3. The bounding box must use normalized [x1,y1,x2,y2] coordinates.
      4. Strictly follow this JSON schema:
         {"answer_option_id":"A","bbox_xyxy_norm":[0.1,0.2,0.3,0.4]}

      [NOTE]:
      1. Choose the correct {{definition}} label for the target landmark in image 2.
      2. Also localize the target landmark in image 2.
    user: |
      Which {{definition}} label best describes the target landmark in image 2? Select one option and return the normalized bounding box of the target landmark in image 2.

      Options:

      {{options_text}}

  image_multiple_choice: # 已废弃
    system: |
      [TASK]: You are a UAV agent. Compare a reference view with candidate images and choose the one that matches the target landmark view.

      [INPUT]:
      - The view definition is:
        {{definition_text}}
      - Image 1 is the reference image and includes the target landmark bounding box.
      - Images 2 to 5 are candidate images.
      - Option A corresponds to image 2.
      - Option B corresponds to image 3.
      - Option C corresponds to image 4.
      - Option D corresponds to image 5.

      [OUTPUT]:
      1. Return exactly one valid JSON object.
      2. Do not output markdown, explanation, or extra text.
      3. The bounding box must use normalized [x1,y1,x2,y2] coordinates.
      4. Strictly follow this JSON schema:
         {"answer_option_id":"A","bbox_xyxy_norm":[0.1,0.2,0.3,0.4]}

      [NOTE]:
      1. Choose which option shows the target landmark as {{target_view}} under {{definition}}.
      2. Also localize the target landmark in the selected image.
    user: |
      Which option corresponds to the image where the target landmark is shown as {{target_view}} under {{definition}}? Select one option and return the normalized bounding box of the target landmark in the selected image.

      Options:

      A. Image 2
      B. Image 3
      C. Image 4
      D. Image 5

behavior_templates:
  stage3:
    atomic:
      gradual_approach: "fly toward the landmark for about {{travel_text}} {{view_text}}"
      gradual_depart: "move away from the landmark for about {{travel_text}} {{view_text}} {{rise_text}}"
      circular_orbit: "circle around the landmark for about {{angle_text}} in a {{direction_text}} direction {{view_text}}"
      spiral_orbit: "spiral around the landmark for about {{angle_text}} in a {{direction_text}} direction {{view_text}}"
      square_orbit: "move around the landmark along a square-shaped loop in a {{direction_text}} direction {{view_text}} {{edge_text}}"
      triangular_orbit: "move around the landmark along a triangular loop in a {{direction_text}} direction {{view_text}} {{edge_text}}"
      figure8_orbit: "fly around the landmark in a figure-eight pattern {{view_text}} {{cycle_text}}"
      sky_rise: "climb steeply near the landmark into a high overhead view {{view_text}}"
      comet: "sweep around the landmark in a long curved pass for about {{angle_text}} {{view_text}}"
      surface_mapping: "scan back and forth over a {{width_text}} by {{height_text}} area around the landmark in an S-shaped pattern {{view_text}} {{lane_text}}"
      default: "{{behavior_name}} {{view_text}}"
    composite:
      atomic_wrapper: "a single-step mission that performs {{element_label}}"
      surface_mapping: "a survey mission that maps the area around one landmark"
      circular: "an inspection mission that circles around one landmark {{extras}}"
      spiral: "an inspection mission that spirals around one landmark {{extras}}"
      square: "an inspection mission that checks one landmark along a square-shaped route {{extras}}"
      triangular: "an inspection mission that checks one landmark along a triangular route {{extras}}"
      multi: "a survey mission that visits multiple landmarks in sequence {{extras}}"
      default: "{{family}} {{extras}}"
  stage4:
    orbit_action: "a {{angle_deg}}-degree {{direction_text}} turn around the landmark"
