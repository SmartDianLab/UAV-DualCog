api:
  # Suffix rule for experiments:
  # - You may pass model names like "...-Instant" or "...-Thinking" in --experiment-models.
  # - Routing still resolves on the suffix-stripped base model key below.
  # - Suffixes only switch family-specific reasoning controls.
  default_models:
    stage2: Qwen/Qwen3.5-9B
    stage3: openai/gpt-5.3-chat
    stage4: Qwen/Qwen3.5-4B

  models:
    openai/gpt-5.3-chat:
      api_source: cloud
      api_base: ${UAV_DUALCOG_API_BASE}
      api_key: ${UAV_DUALCOG_API_KEY}
      request_model: gpt-5.3-chat
      rpm_limit: 60
      tpm_limit: 200000
      rate_limit_reserve_ratio: 0.1

    anthropic/claude-sonnet-4.6:
      api_source: cloud
      api_base: ${UAV_DUALCOG_API_BASE}
      api_key: ${UAV_DUALCOG_API_KEY}
      request_model: claude-sonnet-4.6
      rpm_limit: 60
      tpm_limit: 200000
      rate_limit_reserve_ratio: 0.1

    google/gemini-3-flash-preview:
      api_source: cloud
      api_base: ${UAV_DUALCOG_API_BASE}
      api_key: ${UAV_DUALCOG_API_KEY}
      request_model: gemini-3-flash-preview
      rpm_limit: 60
      tpm_limit: 200000
      rate_limit_reserve_ratio: 0.1

    Qwen/Qwen3.5-9B:
      api_source: local
      api_base: http://127.0.0.1:28000/v1
      api_key: ${UAV_DUALCOG_LOCAL_API_KEY}
      rpm_limit: 1000
      tpm_limit: 1000000
      rate_limit_reserve_ratio: 0.2

    Qwen/Qwen3.5-4B:
      api_source: local
      api_base: http://127.0.0.1:29000/v1
      api_key: ${UAV_DUALCOG_LOCAL_API_KEY}
      rpm_limit: 1000
      tpm_limit: 1000000
      rate_limit_reserve_ratio: 0.2

stage3_temporal:
  api_upload_resize_enabled: true
  api_upload_max_width: 640
  api_upload_max_height: 480
  api_upload_jpeg_quality: 80
  timeout_s: 600
  experiment_concurrency: 1
  api_rpm_limit: 0
  api_tpm_limit: 0
